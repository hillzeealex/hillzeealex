<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Alexander Hills: I turn ideas into products that scale. Product, Dev, DevOps, CI/CD, Run.">
  <style>
    /* layout: identity on the left, the chain as an isometric stack of 5 layers (RUN is the foundation) on the right */
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .p { animation: float 4s ease-in-out infinite; }
    .p2 { animation-delay: -.4s; } .p3 { animation-delay: -.8s; } .p4 { animation-delay: -1.2s; } .p5 { animation-delay: -1.6s; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="440" rx="18"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2433"/>
    </pattern>
    <radialGradient id="glow" cx="0.68" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#1d3b72" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <!-- one plate: top face, left side, right side; centred on x=0, top vertex at y=0 -->
    <g id="side"><path d="M-150 40L0 80V96L-150 56Z" fill="#000" fill-opacity="0.35"/><path d="M0 80L150 40V56L0 96Z" fill="#000" fill-opacity="0.55"/></g>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#0a0d14"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>

    <text x="72" y="72" class="mono" font-size="14" letter-spacing="3" fill="#5b8def">GITHUB.COM/HILLZEEALEX</text>
    <text x="68" y="148" class="sans" font-size="60" font-weight="700" letter-spacing="-2" fill="#eef2f7">Alexander</text>
    <text x="68" y="214" class="sans" font-size="60" font-weight="700" letter-spacing="-2" fill="#eef2f7">Hills</text>
    <text x="72" y="270" class="sans" font-size="26" font-weight="500" fill="#dfe6f0">I turn ideas into products that scale.</text>
    <text x="72" y="302" class="sans" font-size="16" fill="#8b98a9">Production-ready from day one:</text>
    <text x="72" y="326" class="sans" font-size="16" fill="#8b98a9">tested, automated, built for nLPD &amp; GDPR.</text>

    <!-- layers, drawn from the foundation up -->
    <g transform="translate(830 318)"><g class="p p5"><path d="M0 0L150 40L0 80L-150 40Z" fill="#3dd68c"/><use href="#side"/></g></g>
    <g transform="translate(830 256)"><g class="p p4"><path d="M0 0L150 40L0 80L-150 40Z" fill="#9cc0ff"/><use href="#side"/></g></g>
    <g transform="translate(830 194)"><g class="p p3"><path d="M0 0L150 40L0 80L-150 40Z" fill="#5b8def"/><use href="#side"/></g></g>
    <g transform="translate(830 132)"><g class="p p2"><path d="M0 0L150 40L0 80L-150 40Z" fill="#3a63ee"/><use href="#side"/></g></g>
    <g transform="translate(830 70)"><g class="p"><path d="M0 0L150 40L0 80L-150 40Z" fill="#2747d8"/><use href="#side"/></g></g>

    <!-- labels -->
    <g stroke="#2a3956" stroke-width="1">
      <path d="M985 110H1020M985 172H1020M985 234H1020M985 296H1020M985 358H1020"/>
    </g>
    <g class="mono" font-size="12" font-weight="700" letter-spacing="2" fill="#c9d4e5">
      <text x="1030" y="106">01 PRODUCT</text><text x="1030" y="168">02 DEV</text><text x="1030" y="230">03 DEVOPS</text><text x="1030" y="292">04 CI/CD</text><text x="1030" y="354" fill="#3dd68c">05 RUN ●</text>
    </g>
    <g class="sans" font-size="13" fill="#7d8ba0">
      <text x="1030" y="125">Specs · Figma</text>
      <text x="1030" y="187">TypeScript · Next.js · React</text>
      <text x="1030" y="249">Docker · PostgreSQL · Prisma</text>
      <text x="1030" y="311">GitHub Actions · Vitest</text>
      <text x="1030" y="373">Infomaniak · Scalingo</text>
    </g>
  </g>
</svg>
